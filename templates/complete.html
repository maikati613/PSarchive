{% extends "base.html" %}

{% block content %}

<section class="archive-page">

    <h1>Complete PlayStation Game Archive</h1>

    <div class="game-grid">

        {% for game in games %}

        <div class="game-card">

            <h2>{{ game["title"] }}</h2>

            <p><strong>Console:</strong> {{ game["console"] }}</p>

            <p><strong>Release Year:</strong> {{ game["release_year"] }}</p>

            <p>{{ game["description"] }}</p>

        </div>

        {% endfor %}

    </div>

</section>

{% endblock %}
